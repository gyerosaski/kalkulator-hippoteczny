<ui-dialog tag="akcja" title="Zmień nazwę kalkulacji" (closed)="handleClosed()">
  <form (submit)="$event.preventDefault(); confirm()">
    <div class="dialog-body">
      <label class="dialog-label" for="rename-calc-name">Nazwa</label>
      <div class="inp inp--focus">
        <input
          id="rename-calc-name"
          type="text"
          autocomplete="off"
          [value]="currentValue()"
          (input)="onInput($any($event.target).value)"
          (keydown.escape)="dismiss()"
        />
      </div>
      <div class="dialog-hint">
        Nadaj kalkulacji nazwę, po której łatwo ją rozpoznasz — np. „Mieszkanie 65&nbsp;m² Wrocław".
      </div>
    </div>
    <div class="dialog-actions">
      <button class="btn btn--ghost" type="button" (click)="dismiss()">Anuluj</button>
      <button class="btn btn--primary" type="submit" [disabled]="isConfirmDisabled()">
        Zapisz
      </button>
    </div>
  </form>
</ui-dialog>
