<dialog #dialogEl (close)="onClose()">
  <h2 class="dialog-title">Błąd wczytywania kalkulacji</h2>
  <p class="dialog-desc">Plik zawiera nieprawidłowe lub brakujące dane. Sprawdź poniższe pola:</p>
  <ul class="error-list">
    @for (error of errors; track $index) {
      <li class="error-list__item">
        @if (error.path) {
          <code class="error-path">{{ error.path }}</code>
        }
        <span class="error-msg">{{ error.message }}</span>
      </li>
    }
  </ul>
  <div class="dialog-actions">
    <button class="btn btn--primary" type="button" (click)="close()">Zamknij</button>
  </div>
</dialog>
