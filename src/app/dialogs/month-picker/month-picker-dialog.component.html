<ui-dialog title="Wybierz miesiąc" (closed)="handleClosed()">
  <div class="mp-decade-nav">
    <button
      class="ico-btn mp-nav-btn"
      type="button"
      (click)="shiftDecade(-10)"
      aria-label="Cofnij o 10 lat"
    >
      <icon-chevron-right class="mp-nav-icon mp-nav-icon--prev" />
    </button>
    <span class="mp-decade-range mono">{{ decadeStart() }}–{{ decadeStart() + 9 }}</span>
    <button
      class="ico-btn mp-nav-btn"
      type="button"
      (click)="shiftDecade(10)"
      aria-label="Naprzód o 10 lat"
    >
      <icon-chevron-right class="mp-nav-icon" />
    </button>
  </div>

  <div class="mp-years">
    @for (year of years(); track year) {
      <button
        class="mp-year"
        type="button"
        [class.is-focused]="year === stagedYear()"
        [class.is-selected]="isYearSelected(year)"
        (click)="stagedYear.set(year)"
      >
        {{ year }}
      </button>
    }
  </div>

  <div class="mp-months">
    <div class="mp-months-grid">
      @for (monthName of monthNamesShort; track $index) {
        <button
          class="mp-month"
          type="button"
          [class.is-focused]="$index === stagedMonth()"
          [class.is-selected]="isMonthSelected($index)"
          (click)="pickMonth($index)"
        >
          {{ monthName }}
        </button>
      }
    </div>
  </div>
</ui-dialog>
