<ui-dialog tag="ustawienia" title="Ustawienia" (closed)="handleClosed()">
  <div class="dialog-body">
    <div class="setting-row">
      <label class="setting-label" for="settings-theme">Motyw</label>
      <ui-select
        inputId="settings-theme"
        [options]="themeOptions"
        [labels]="themeOptions | themeLabel"
        [formControl]="themeControl"
      />
    </div>
  </div>
  <div class="dialog-actions">
    <button class="btn btn--primary" type="button" (click)="dismiss()">Gotowe</button>
  </div>
</ui-dialog>
