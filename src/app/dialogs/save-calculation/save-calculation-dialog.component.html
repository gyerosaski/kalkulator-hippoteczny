<ui-dialog title="Zapis kalkulacji" [size]="DialogSize.SMALL" (closed)="handleClosed()">
  <form (submit)="$event.preventDefault(); onSave()">
    <div class="dialog-body">
      <div class="field">
        <label class="field-label" for="save-calc-name">Nazwa</label>
        <div class="inp">
          <input
            id="save-calc-name"
            [formControl]="nameCtrl"
            placeholder="np. Moja kalkulacja"
            autocomplete="off"
          />
        </div>
        @if (nameCtrl.hasError('required') && nameCtrl.touched) {
          <span class="field-hint field-hint--error">Nazwa jest wymagana.</span>
        }
      </div>
    </div>
    <div class="dialog-actions">
      <button class="btn btn--ghost" type="button" (click)="dismiss()">Anuluj</button>
      <button class="btn btn--primary" type="submit" [disabled]="nameCtrl.invalid">Zapisz</button>
    </div>
  </form>
</ui-dialog>
