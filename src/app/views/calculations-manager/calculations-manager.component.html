<div class="saved-view">
  <header class="view-hero">
    <button class="btn btn--primary" type="button" (click)="navigateToNewCalculation()">
      <icon-plus />
      Nowa kalkulacja
    </button>
    <button class="btn btn--secondary" type="button" (click)="saveAsNewCalculation()">
      Zapisz jako
    </button>
    <button class="btn btn--ghost" type="button" (click)="importFromFile()">
      <icon-download />
      Importuj
    </button>
  </header>

  <!-- TOOLBAR -->
  <div class="filter-toolbar">
    <div class="search-field">
      <icon-search />
      <input
        type="text"
        placeholder="Szukaj po nazwie…"
        [value]="searchQuery()"
        (input)="searchQuery.set($any($event.target).value)"
      />
      @if (searchQuery()) {
        <button class="search-clear" (click)="searchQuery.set('')" aria-label="Wyczyść">×</button>
      }
    </div>

    <div class="sort-control">
      <span class="muted small">Sortuj:</span>
      <ui-select
        [formControl]="activeSortControl"
        [options]="sortOptionValues"
        [labels]="sortOptionLabels"
      />
    </div>
  </div>

  <app-calculations-list
    [calculations]="filteredCalculations()"
    [activeCalculationName]="activeCalculationName()"
    [isLoadedCalculationModified]="isLoadedCalculationModified()"
    [hasActiveFilter]="hasActiveFilter()"
    (load)="loadCalculation($event)"
    (saveChanges)="saveCurrentCalculation($event)"
    (rename)="startRename($event)"
    (delete)="startDelete($event)"
    (duplicate)="duplicateCalculation($event)"
    (clearFilters)="clearFilters()"
  />

  <!-- FOOTER -->
  <div class="view-footer">
    <div class="muted small">
      Wyświetlono <b class="mono">{{ filteredCalculations().length }}</b> z
      <b class="mono">{{ calculations().length }}</b> kalkulacji · dane przechowywane lokalnie
      @if (storePathResource.value(); as path) {
        · <span class="mono path-label" [title]="path">{{ path }}</span>
      }
    </div>
    <button
      class="btn btn--ghost btn--mini"
      [disabled]="calculations().length === 0"
      (click)="exportAllToFile()"
    >
      <icon-download />
      Eksportuj wszystkie do JSON
    </button>
  </div>

  <!-- TOAST -->
  @if (toastMessage(); as message) {
    <div class="toast-notification" role="status">
      <icon-check-circle />
      <span>{{ message }}</span>
    </div>
  }

  <app-save-calculation-dialog />
  <app-rename-calculation-dialog />
  <app-delete-calculation-dialog />
</div>
