<div class="subsec-head">
  <button
    type="button"
    class="subsec-toggle"
    [class.is-open]="open()"
    (click)="openChange.emit(!open())"
  >
    <span class="subsec-num">{{ num() }}</span>
    @if (context()) {
      <ui-color-code-marker [variant]="context()!" />
    }
    @if (title()) {
      <span class="subsec-title">{{ title() }}</span>
    }
    <span class="subsec-chev"><icon-chevron-right /></span>
  </button>
</div>
@if (open()) {
  <div class="subsec-body">
    <ng-content />
  </div>
}
