<header class="topbar">
  <div class="brand">
    <div class="brand-mark">
      <icon-calculator />
    </div>
    <div>
      <div class="brand-name">Kalkulator Hipoteczny</div>
    </div>
  </div>
  <nav class="tabs">
    <span
      class="tab-indicator"
      [class.is-visible]="isIndicatorVisible()"
      [style.left]="indicatorStyle().left"
      [style.width]="indicatorStyle().width"
    ></span>
    <button class="tab" #tabBtn [class.is-on]="isCalculatorTab()" (click)="navigateToCalculator()">
      Kalkulator
    </button>
    <button
      class="tab"
      #tabBtn
      [class.is-on]="isCalculatorManagerTab()"
      (click)="navigateToCalculatorManager()"
    >
      Twoje kalkulacje
    </button>
    <button
      class="tab"
      #tabBtn
      [class.is-on]="isCalculationsCompareTab()"
      (click)="navigateToCalculationsCompare()"
    >
      Porównanie ofert
    </button>
  </nav>
  <div class="topbar-actions">
    <button
      class="ico-btn"
      type="button"
      (click)="themeService.toggle()"
      [title]="themeService.darkMode() ? 'Tryb jasny' : 'Tryb ciemny'"
    >
      @if (themeService.darkMode()) {
        <icon-sun />
      } @else {
        <icon-moon />
      }
    </button>
  </div>
</header>
