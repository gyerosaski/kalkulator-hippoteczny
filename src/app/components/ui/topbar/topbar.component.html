<header class="topbar">
  <div class="brand">
    <div class="brand-mark">
      <icon-calculator />
    </div>
    <div>
      <div class="brand-name">Kalkulator Hipoteczny</div>
    </div>
  </div>
  <nav class="tabs">
    <button class="tab" [class.is-on]="!isSavedTab()" (click)="navigateToCalculator()">
      Kalkulator
    </button>
    <button class="tab" [class.is-on]="isSavedTab()" (click)="navigateToSaved()">
      Twoje kalkulacje
    </button>
    <button class="tab" [disabled]="true">Porównanie ofert</button>
  </nav>
  <div class="topbar-actions">
    @if (!isSavedTab()) {
      <button class="btn btn--ghost" type="button" (click)="setDefaults()">Wstaw domyślne</button>
      <button class="btn btn--ghost" type="button" (click)="loadCalculationFromFile()">
        Wczytaj kalkulację
      </button>
      <button class="btn btn--primary" type="button" (click)="saveCalculation()">
        Zapisz kalkulację
      </button>
    }
    <button
      class="ico-btn"
      type="button"
      (click)="themeService.toggle()"
      [title]="themeService.darkMode() ? 'Tryb jasny' : 'Tryb ciemny'"
    >
      @if (themeService.darkMode()) {
        <icon-sun />
      } @else {
        <icon-moon />
      }
    </button>
  </div>
</header>

<app-save-calculation-dialog />
<app-load-validation-error-dialog />
