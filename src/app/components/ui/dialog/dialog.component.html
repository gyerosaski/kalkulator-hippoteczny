<dialog
  #dialogEl
  [attr.data-size]="size()"
  [class.dialog--danger]="variant() === DialogVariant.DANGER"
  (close)="onNativeClose()"
>
  <ng-content select="[slot=head]">
    @if (title()) {
      <div class="dialog-head">
        <div>
          @if (tag()) {
            <div class="dialog-tag" [class.dialog-tag--danger]="variant() === DialogVariant.DANGER">
              {{ tag() }}
            </div>
          }
          <h2 class="dialog-title">{{ title() }}</h2>
        </div>
        @if (showClose()) {
          <button class="dialog-close" type="button" (click)="close()" aria-label="Zamknij">
            ×
          </button>
        }
      </div>
    }
  </ng-content>
  <ng-content />
</dialog>
