<div
  #donutWrap
  class="donut-wrap"
  [style.width.px]="fluid() ? null : size()"
  [style.height.px]="fluid() ? null : size()"
>
  <svg class="donut-svg" [attr.viewBox]="'0 0 ' + effectiveSize() + ' ' + effectiveSize()">
    <circle
      [attr.cx]="c()"
      [attr.cy]="c()"
      [attr.r]="r()"
      fill="none"
      stroke="var(--track)"
      [attr.stroke-width]="thickness()"
    />
    @for (s of slices(); track s.slice.label) {
      <circle
        class="donut-slice"
        [class.donut-slice--active]="s.slice.label === activeLabel() || isAllActive()"
        [attr.cx]="c()"
        [attr.cy]="c()"
        [attr.r]="r()"
        fill="none"
        [attr.stroke]="s.slice.color"
        [attr.stroke-width]="
          s.slice.label === activeLabel() || isAllActive()
            ? thickness() + activeStrokeBoost
            : thickness()
        "
        [attr.stroke-dasharray]="s.dasharray"
        [attr.stroke-dashoffset]="s.offset"
        [attr.transform]="'rotate(-90 ' + c() + ' ' + c() + ')'"
        (mouseenter)="sliceHover.emit(s.slice.label)"
        (mouseleave)="sliceHover.emit(null)"
      />
    }
  </svg>
  <div class="donut-center">
    <div class="donut-label">{{ centerLabel() }}</div>
    @for (value of [centerValue()]; track value) {
      <div class="donut-value mono">{{ value }}</div>
    }
  </div>
</div>
