<div class="sel">
  <select
    [attr.id]="inputId() || null"
    [disabled]="disabled()"
    [value]="_value()"
    (change)="onNativeChange($any($event.target).value)"
    (blur)="onBlur()"
  >
    @for (o of options(); track o; let i = $index) {
      <option [value]="o">{{ labels()[i] || o }}</option>
    }
  </select>
  <icon-chevron-down />
</div>
