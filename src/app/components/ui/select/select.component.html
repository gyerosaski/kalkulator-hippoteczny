<div class="sel">
  <select
    [attr.id]="inputId() || null"
    [disabled]="disabled()"
    (change)="onValueChange($event)"
    (blur)="onBlur()"
  >
    @for (option of options(); track option; let index = $index) {
      <option [value]="option" [selected]="option === value()">
        {{ labels()[index] || option }}
      </option>
    }
  </select>
</div>
