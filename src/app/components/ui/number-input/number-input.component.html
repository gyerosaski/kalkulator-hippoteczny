<div class="inp" [class.inp--focus]="focused()" [class.inp--disabled]="disabled()">
  <input
    type="text"
    inputmode="decimal"
    [disabled]="disabled()"
    [value]="display()"
    (focus)="onFocus()"
    (blur)="onBlur()"
    (input)="onInput($any($event.target).value)"
    class="mono"
  />
  @if (suffix()) {
    <span class="suffix">{{ suffix() }}</span>
  }
  @if (hint()) {
    <span class="hint">{{ hint() }}</span>
  }
</div>
