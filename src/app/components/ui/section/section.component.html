<section class="section">
  <div class="section-head">
    <div class="section-head-text">
      @if (tag()) {
        <div class="section-tag">{{ tag() }}</div>
      }
      @if (heading()) {
        <h2 class="section-title">{{ heading() }}</h2>
      }
    </div>
    <ng-content select="[slot=actions]" />
  </div>

  <ng-content />
</section>
