<app-foldable-section title="Dane podstawowe" num="" badge="Dane wymagane do przeprowadzenia kalkulacji" [defaultOpen]="true">
  <div [formGroup]="basicData">
    <div class="grid">
      <label>
        1. Wartość nieruchomości (zł)
        <input type="number" formControlName="propertyValue" (change)="onPropertyValueChanged()" />
      </label>
      <label>
        2. Kwota kredytu (zł)
        <input type="number" formControlName="loanAmount" (change)="onLoanAmountChanged()" />
      </label>
      <label>
        3. LTV (%)
        <input type="number" step="0.01" formControlName="ltv" (change)="onLtvChanged()" />
      </label>
      <div class="row">
        <label>
          4. Okres kredytowania
          <input
            type="number"
            min="1"
            [value]="loanPeriodDisplayValue"
            (change)="onLoanPeriodDisplayChanged($event)"
          />
        </label>
        <div class="radio-group">
          <label>
            <input
              type="radio"
              name="loanPeriodUnit"
              value="lata"
              [checked]="loanPeriodUnit === 'lata'"
              (change)="onLoanPeriodUnitChanged('lata')"
            />
            lat
          </label>
          <label>
            <input
              type="radio"
              name="loanPeriodUnit"
              value="miesiące"
              [checked]="loanPeriodUnit === 'miesiące'"
              (change)="onLoanPeriodUnitChanged('miesiące')"
            />
            miesięcy
          </label>
        </div>
      </div>
      <label>
        5. Data uruchomienia kredytu (YYYY-MM)
        <input type="month" formControlName="startDate" />
        <small>{{ basicData.get('startDate')?.value | formatMonth }}</small>
      </label>
      <label>
        6. Początek spłat kapitału (YYYY-MM)
        <input type="month" formControlName="capitalStartDate" />
        <small>{{ basicData.get('capitalStartDate')?.value | formatMonth }}</small>
      </label>
    </div>

    <div class="grid" style="margin-top: 0.75rem">
      <label>
        7. Typ rat
        <select formControlName="installmentType">
          <option value="rowne">równe</option>
          <option value="malejace">malejące</option>
        </select>
      </label>
    </div>

    <div class="stack" style="margin-top: 0.75rem" formArrayName="ratePeriods">
      @for (period of ratePeriods.controls; track $index) {
        <div class="card" [formGroupName]="$index">
          <h3>
            @if ($index === 0) {
              Oprocentowanie (od początku)
            } @else {
              Oprocentowanie od
              <input
                type="month"
                formControlName="from"
                style="display:inline; width:auto; padding:0.25rem"
              />
              <small style="margin-left:0.25rem">{{ period.get('from')?.value | formatMonth }}</small>
            }
          </h3>
          <div class="grid">
            <div class="row">
              <label>
                Stopa
                <select formControlName="rateType">
                  <option value="zmienna">zmienna</option>
                  <option value="stala">stała</option>
                </select>
              </label>
            </div>
            @if (period.get('rateType')?.value === 'zmienna') {
              <div class="row">
                <label>
                  8.a WIBOR (%)
                  <input type="number" step="0.01" formControlName="wibor" />
                </label>
                <label>
                  8.b Marża (%)
                  <input type="number" step="0.01" formControlName="margin" />
                </label>
                <label>
                  8. Oprocentowanie (nominalne, %)
                  <input
                    type="number"
                    step="0.01"
                    [value]="(period.get('wibor')?.value || 0) + (period.get('margin')?.value || 0)"
                    disabled
                  />
                </label>
              </div>
            } @else {
              <label>
                8. Oprocentowanie stałe (%)
                <input type="number" step="0.01" formControlName="nominalRate" />
              </label>
            }
          </div>
          @if ($index > 0) {
            <div class="row" style="margin-top: 0.5rem">
              <button type="button" (click)="removeRatePeriod($index)">−</button>
            </div>
          }
        </div>
      }
    </div>

    <div class="actions">
      <button type="button" (click)="addRatePeriod()">+ Dodaj zmianę oprocentowania</button>
    </div>
  </div>
</app-foldable-section>
