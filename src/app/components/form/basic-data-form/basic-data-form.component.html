<ui-section
  title="Dane podstawowe"
  badge="Dane wymagane do przeprowadzenia kalkulacji"
  [defaultOpen]="true"
>
  <div [formGroup]="basicData">
    <div class="row row--3">
      <ui-field num="1" label="Wartość nieruchomości">
        <ui-number-input
          formControlName="propertyValue"
          suffix="zł"
          [decimals]="2"
          (valueChange)="onPropertyValueChanged()"
        />
      </ui-field>

      <ui-field num="2" label="Kwota kredytu">
        <ui-number-input
          formControlName="loanAmount"
          suffix="zł"
          [decimals]="2"
          (valueChange)="onLoanAmountChanged()"
        />
      </ui-field>

      <ui-field num="3" label="LTV">
        <ui-number-input
          formControlName="ltv"
          suffix="%"
          [decimals]="2"
          (valueChange)="onLtvChanged()"
        />
      </ui-field>
    </div>

    <div class="row row--3">
      <ui-field num="4" label="Okres kredytowania">
        <div class="inline">
          <ui-number-input
            [value]="loanPeriodDisplayValue"
            [decimals]="0"
            (valueChange)="onLoanPeriodValueChanged($event)"
          />
          <ui-segmented
            [options]="loanPeriodUnitOptions"
            [labels]="loanPeriodUnitOptions | loanPeriodUnitLabel"
            [value]="loanPeriodUnit"
            (valueChange)="onLoanPeriodUnitChanged($event)"
            [compact]="true"
          />
        </div>
      </ui-field>

      <ui-field num="5" label="Data uruchomienia kredytu">
        <ui-month-picker formControlName="startDate" />
      </ui-field>

      <ui-field num="6" label="Początek spłat kapitału">
        <ui-month-picker formControlName="capitalStartDate" />
      </ui-field>
    </div>

    <div class="row row--3">
      <ui-field num="7" label="Typ rat">
        <ui-segmented
          formControlName="installmentType"
          [options]="installmentTypeOptions"
          [labels]="installmentTypeOptions | installmentTypeLabel"
        />
      </ui-field>
    </div>

    <ui-cards-group>
      <div formArrayName="ratePeriods">
        @for (period of ratePeriodControls(); track $index) {
          <ui-card
            [tag]="'OKRES ' + ($index + 1)"
            [removable]="$index > 0"
            (remove)="removeRatePeriod($index)"
            [formGroupName]="$index"
          >
            @if ($index === 0) {
              <span slot="header" class="muted small">od daty uruchomienia kredytu</span>
            } @else {
              <ng-container slot="header">
                <span class="muted small">od</span>
                <div class="rate-period-from">
                  <ui-month-picker formControlName="from" />
                </div>
              </ng-container>
            }
            <div class="row row--4">
              <ui-field label="Stopa" num="8">
                <ui-segmented
                  formControlName="rateType"
                  [options]="rateTypeOptions"
                  [labels]="rateTypeOptions | rateTypeLabel"
                />
              </ui-field>
              @if (period.get('rateType')?.value === RateType.VARIABLE) {
                <ui-field num="9a" label="WIBOR">
                  <ui-number-input formControlName="wibor" suffix="%" [decimals]="2" />
                </ui-field>
                <ui-field num="9b" label="Marża">
                  <ui-number-input formControlName="margin" suffix="%" [decimals]="2" />
                </ui-field>
              }
              <ui-field
                num="9"
                label="Oprocentowanie"
                [style.gridColumn]="
                  period.get('rateType')?.value !== RateType.VARIABLE ? 'span 1' : null
                "
                [hint]="
                  period.get('rateType')?.value === RateType.VARIABLE
                    ? 'WIBOR + Marża'
                    : 'wartość stała'
                "
              >
                @if (period.get('rateType')?.value === RateType.VARIABLE) {
                  <div class="inp inp--disabled">
                    <input
                      type="text"
                      class="mono"
                      [value]="
                        ((period.get('wibor')?.value || 0) + (period.get('margin')?.value || 0))
                          .toFixed(2)
                          .replace('.', ',')
                      "
                      readonly
                    />
                    <span class="suffix">%</span>
                  </div>
                } @else {
                  <ui-number-input formControlName="nominalRate" suffix="%" [decimals]="2" />
                }
              </ui-field>
            </div>
          </ui-card>
        }
      </div>
      <ui-btn-add label="Dodaj okres oprocentowania" (add)="addRatePeriod()" />
    </ui-cards-group>
  </div>
</ui-section>
