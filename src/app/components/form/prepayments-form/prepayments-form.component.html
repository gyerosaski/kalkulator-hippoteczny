<ui-section
  title="Nadpłaty"
  [marker]="ColorCodeMarkerVariant.PREPAYMENT"
  [badge]="badge()"
  [toggleable]="true"
  [defaultOpen]="false"
  [enabled]="isSectionEnabled()"
  (enabledChange)="sectionEnabledControl.setValue($event)"
>
  <div>
    <ui-subsection
      [num]="1"
      title="Reguły nadpłat"
      [open]="subsectionsOpen().prepaymentRules"
      (openChange)="setSubsectionOpen('prepaymentRules', $event)"
    >
      @for (rule of prepaymentRulesArray.controls; track $index) {
        @let ruleControls = rule.controls;
        <ui-card
          [tag]="($index + 1).toString()"
          [removable]="$index > 0"
          (remove)="removePrepaymentRule($index)"
        >
          <div class="row row--2">
            <ui-field label="Jak często nadpłacasz?" num="1a">
              <ui-select
                [formControl]="ruleControls.frequency"
                [options]="prepaymentFrequencyOptions"
                [labels]="prepaymentFrequencyOptions | prepaymentFrequencyLabel"
                (valueChange)="onPrepaymentFrequencyChanged($index)"
              />
            </ui-field>
            @if (ruleControls.frequency.value === PrepaymentFrequency.ONE_TIME) {
              <ui-field label="Data nadpłaty" num="1b">
                <ui-month-picker
                  [formControl]="ruleControls.from"
                  (valueChange)="onPrepaymentFromChanged($index)"
                />
              </ui-field>
            } @else {
              <ui-field label="Data nadpłaty od" num="1b">
                <ui-month-picker
                  [formControl]="ruleControls.from"
                  (valueChange)="onPrepaymentFromChanged($index)"
                />
              </ui-field>
              <ui-field label="Data nadpłaty do" num="1c">
                <ui-month-picker [formControl]="ruleControls.to" />
              </ui-field>
            }
            <ui-field label="Kwota nadpłaty" num="1d">
              <ui-number-input [formControl]="ruleControls.amount" suffix="zł" [decimals]="2" />
            </ui-field>
            <ui-field label="Skutek nadpłaty" num="1e">
              <ui-select
                [formControl]="ruleControls.effect"
                [options]="prepaymentEffectOptions"
                [labels]="prepaymentEffectOptions | prepaymentEffectLabel"
              />
            </ui-field>
          </div>
        </ui-card>
      }
      <ui-btn-add label="Dodaj regułę nadpłaty" (add)="addPrepaymentRule()" />
    </ui-subsection>

    <ui-divider />

    <ui-subsection
      [num]="2"
      title="Docelowa rata"
      [open]="subsectionsOpen().rataDocelowaRegula"
      (openChange)="setSubsectionOpen('rataDocelowaRegula', $event)"
    >
      <div class="row row--2">
        <ui-field label="Chcę co miesiąc płacić do banku ratę w wysokości" num="2a">
          <ui-number-input [formControl]="targetRateControl" suffix="zł" [decimals]="2" />
        </ui-field>
        <ui-field label="Data nadpłaty od" num="2b">
          <ui-month-picker [formControl]="targetInstallmentFromControl" />
        </ui-field>
        <ui-field label="Data nadpłaty do" num="2c">
          <ui-month-picker [formControl]="targetInstallmentToControl" />
        </ui-field>
        <ui-field label="Skutek nadpłaty" num="2d">
          <ui-select
            [formControl]="targetInstallmentEffectControl"
            [options]="prepaymentEffectOptions"
            [labels]="prepaymentEffectOptions | prepaymentEffectLabel"
          />
        </ui-field>
      </div>
    </ui-subsection>

    <ui-divider />

    <ui-subsection
      [num]="3"
      title="Prowizja za wcześniejszą spłatę"
      [open]="subsectionsOpen().prowizjaWczesniejszaSplata"
      (openChange)="setSubsectionOpen('prowizjaWczesniejszaSplata', $event)"
    >
      <div class="row row--2">
        <ui-field label="Wysokość prowizji za wcześniejszą spłatę" num="3a">
          <ui-number-input [formControl]="earlyRepaymentRatePctControl" suffix="%" [decimals]="2" />
        </ui-field>
        <ui-field label="Bank pobiera prowizję do" num="3b">
          <ui-month-picker [formControl]="earlyRepaymentValidUntilControl" />
        </ui-field>
      </div>
    </ui-subsection>
  </div>
</ui-section>
