<div class="view-footer">
  <div class="muted small">
    Wyświetlono <b class="mono">{{ filteredCount() }}</b> z
    <b class="mono">{{ totalCount() }}</b> kalkulacji · Twoje dane są przechowywane lokalnie
    @if (storePath(); as path) {
      · <span class="mono path-label" [title]="path">{{ path }}</span>
    }
  </div>
  <ui-dropdown
    [options]="exportFormatValues"
    [labels]="exportFormatValues | exportFormatLabel"
    [disabled]="totalCount() === 0"
    (select)="exportRequested.emit($any($event))"
  >
    <icon-download />
    Eksportuj wszystkie
  </ui-dropdown>
</div>
