@let row = selectedRow();
<ui-card>
  <div class="card-head">
    <h3>
      @if (row) {
        Struktura raty w miesiącu {{ row.date | formatMonth }}
      } @else {
        Struktura pierwszej raty
      }
    </h3>
  </div>
  <div class="donut-row">
    <ui-donut
      [data]="firstSlices()"
      centerLabel="rata"
      [centerValue]="firstCenter()"
      [activeLabel]="activeLabel()"
      (sliceHover)="activeLabel.set($event)"
    />
    <ui-legend
      [slices]="firstSlices()"
      totalLabel="Razem"
      [activeLabel]="activeLabel()"
      (sliceHover)="activeLabel.set($event)"
    />
  </div>
</ui-card>
