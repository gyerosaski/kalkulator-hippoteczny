@let row = selectedRow();
<ui-card>
  <div class="card-head">
    <div>
      <h3>
        Struktura płatności
        @if (row) {
          <span class="card-head-suffix"> do {{ row.date | formatMonth }}</span>
        }
      </h3>
      <div class="muted small">
        @if (row) {
          narastająco od początku do wybranego miesiąca ·
          <button class="link-btn" (click)="clearSelection()">pokaż cały okres</button>
        } @else {
          w pełnym okresie kredytowania
        }
      </div>
    </div>
    @if (results()?.rrso; as rrsoValue) {
      <div class="head-metric">
        <span class="muted small">RRSO</span>
        <span class="head-metric-value mono">{{ rrsoValue | formatRate }}</span>
      </div>
    }
  </div>
  <div class="donut-row">
    <ui-donut
      [data]="totalSlices()"
      [centerLabel]="centerContent().label"
      [centerValue]="centerContent().value"
      [activeLabel]="activeLabel()"
      (sliceHover)="activeLabel.set($event)"
    />
    <ui-legend
      [slices]="totalSlices()"
      [legendId]="LegendId.DONUT_TOTAL"
      totalLabel="Suma wszystkich płatności"
      [activeLabel]="activeLabel()"
      (sliceHover)="activeLabel.set($event)"
    />
  </div>
</ui-card>
