<div class="app">
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">
        <svg width="24" height="24" viewBox="0 0 24 24">
          <rect x="3" y="3" width="18" height="18" rx="5" fill="var(--accent-sage-deep)" />
          <path
            d="M8 12 L11 15 L16 9"
            stroke="white"
            stroke-width="2"
            fill="none"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </div>
      <div>
        <div class="brand-name">Kalkulator hipoteczny</div>
        <div class="brand-sub">pl-PL</div>
      </div>
    </div>
    <nav class="tabs">
      <button class="tab is-on">Kalkulator</button>
    </nav>
    <div class="topbar-actions">
      <button class="btn btn--ghost" type="button" (click)="setDefaults()">
        <span class="ico">↻</span>Wstaw domyślne
      </button>
      <button class="btn btn--ghost" type="button" (click)="clearAll()">Wyczyść</button>
      <button class="btn btn--primary" type="button" (click)="saveCalculation()">
        Zapisz kalkulację
      </button>
    </div>
  </header>

  <div class="two-column-layout">
    <div class="column">
      <app-basic-data-form></app-basic-data-form>
      <app-overhead-costs-form></app-overhead-costs-form>
      <app-tranches-form></app-tranches-form>
      <app-prepayments-form></app-prepayments-form>
    </div>

    <div class="column">
      <app-results-errors></app-results-errors>
      <app-results-summary [results]="results()"></app-results-summary>
      <app-results-charts [results]="results()"></app-results-charts>
      <app-results-schedule [yearlyGroups]="yearlyGroups()"></app-results-schedule>
    </div>
  </div>
</div>
