<div class="app">
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
          <rect x="3" y="2" width="18" height="20" rx="3" fill="var(--accent-sage-deep)" />
          <rect x="6" y="5" width="12" height="4" rx="1" fill="white" />
          <rect x="6" y="12" width="3" height="3" rx="0.5" fill="white" />
          <rect x="10.5" y="12" width="3" height="3" rx="0.5" fill="white" />
          <rect x="15" y="12" width="3" height="3" rx="0.5" fill="white" />
          <rect x="6" y="17" width="3" height="3" rx="0.5" fill="white" />
          <rect x="10.5" y="17" width="3" height="3" rx="0.5" fill="white" />
          <rect x="15" y="17" width="3" height="3" rx="0.5" fill="white" />
        </svg>
      </div>
      <div>
        <div class="brand-name">Kalkulator Hipoteczny</div>
      </div>
    </div>
    <nav class="tabs">
      <button class="tab is-on">Kalkulator</button>
      <button class="tab">Twoje kalkulacje</button>
      <button class="tab">Porównanie ofert</button>
    </nav>
    <div class="topbar-actions">
      <button class="btn btn--ghost" type="button" (click)="setDefaults()">
        <span class="ico">↻</span>Wstaw domyślne
      </button>
      <button class="btn btn--ghost" type="button" (click)="clearAll()">Wyczyść</button>
      <button class="btn btn--primary" type="button" (click)="saveCalculation()">
        Zapisz kalkulację
      </button>
    </div>
  </header>

  <div class="two-column-layout">
    <div class="column">
      <app-basic-data-form></app-basic-data-form>
      <app-overhead-costs-form></app-overhead-costs-form>
      <app-tranches-form></app-tranches-form>
      <app-prepayments-form></app-prepayments-form>
    </div>

    <div class="column">
      <app-results-errors></app-results-errors>
      <app-results-summary [results]="results()"></app-results-summary>
      <app-results-charts [results]="results()"></app-results-charts>
      <app-results-schedule [yearlyGroups]="yearlyGroups()"></app-results-schedule>
    </div>
  </div>
</div>
