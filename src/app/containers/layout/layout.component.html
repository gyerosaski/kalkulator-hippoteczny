<div class="app">
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">
        <icon-calculator />
      </div>
      <div>
        <div class="brand-name">Kalkulator Hipoteczny</div>
      </div>
    </div>
    <nav class="tabs">
      <button class="tab is-on">Kalkulator</button>
      <button class="tab">Twoje kalkulacje</button>
      <button class="tab">Porównanie ofert</button>
    </nav>
    <div class="topbar-actions">
      <button class="btn btn--ghost" type="button" (click)="setDefaults()">Wstaw domyślne</button>
      <button class="btn btn--primary" type="button" (click)="saveCalculation()">
        Zapisz kalkulację
      </button>
    </div>
  </header>

  <div class="two-column-layout">
    <div class="column">
      <app-basic-data-form />
      <app-overhead-costs-form />
      <app-tranches-form />
      <app-prepayments-form />
    </div>

    <div class="column">
      <app-results-summary [results]="results()" />
      <app-results-charts [results]="results()" />
      <app-results-schedule [yearlyGroups]="yearlyGroups()" />
      <app-results-errors />
    </div>
  </div>

  <app-save-calculation-dialog />
</div>
