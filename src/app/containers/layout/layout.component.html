<div class="two-column-layout app">
  <div class="column column-left" [style.flex]="leftFlex">
    <app-basic-data-form></app-basic-data-form>

    <app-overhead-costs-form></app-overhead-costs-form>

    <app-tranches-form></app-tranches-form>

    <app-prepayments-form></app-prepayments-form>

    <div class="actions">
      <button type="button" (click)="setDefaults()">Wstaw domyślne</button>
      <button type="button" (click)="clearAll()">Wyczyść dane</button>
      <button type="button" (click)="saveCalculation()">Zapisz kalkulację</button>
    </div>
  </div>

  <div class="column-divider" (mousedown)="onDividerMouseDown($event)"></div>

  <div class="column column-right" [style.flex]="rightFlex">
    <app-results-errors></app-results-errors>
    <app-results-summary [results]="results()"></app-results-summary>
    <app-results-schedule [yearlyGroups]="yearlyGroups()"></app-results-schedule>
  </div>
</div>
