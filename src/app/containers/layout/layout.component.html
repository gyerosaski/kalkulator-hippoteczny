<div class="app" [attr.data-theme]="themeService.darkMode() ? 'dark' : null">
  <app-topbar />

  <div class="two-column-layout">
    <div class="column">
      <app-basic-data-form />
      <app-tranches-form />
      <app-overhead-costs-form />
      <app-prepayments-form />
    </div>

    <div class="column">
      @if (results(); as resultsValue) {
        @if (yearlyGroups()?.length) {
          <app-results-summary [results]="resultsValue" />
          <app-results-charts [results]="resultsValue" />
          <app-results-trend-chart
            [yearlyGroups]="yearlyGroups()"
            [loanAmount]="loanAmount"
            [startMonth]="resultsValue.schedule[0]?.date ?? null"
            [endMonth]="resultsValue.schedule[resultsValue.schedule.length - 1]?.date ?? null"
          />
          <app-results-schedule [yearlyGroups]="yearlyGroups()" />
        } @else {
          <app-results-errors />
        }
      } @else {
        <app-results-errors />
      }
    </div>
  </div>
</div>
