name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    permissions:
      contents: write            # wymagane do utworzenia Release
    runs-on: windows-latest      # MSI/NSIS budują się tylko na Windows

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22        # Angular 21 wymaga Node 20+; 22 = aktualne LTS
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust (src-tauri/target)
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend deps
        run: npm ci

      - name: Build & release (Tauri)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Kalkulator Hippoteczny ${{ github.ref_name }}'
          releaseBody: 'Instalatory Windows (MSI / NSIS) oraz przenośna wersja standalone (.exe) w załącznikach poniżej.'
          releaseDraft: true       # Release powstaje jako draft — publikujesz ręcznie po weryfikacji
          prerelease: false

      # tauri-action dołącza do Release tylko instalatory (MSI/NSIS).
      # Surowy plik wykonywalny z target/release to przenośna wersja standalone
      # (bez instalacji — wymaga jedynie środowiska WebView2, obecnego w Windows 10/11).
      - name: Dołącz wersję standalone (portable .exe) do Release
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $executable = Get-ChildItem -Path "src-tauri/target/release" -Filter *.exe -File |
            Select-Object -First 1
          if (-not $executable) { throw "Nie znaleziono pliku .exe wersji standalone w src-tauri/target/release" }
          $portableName = "Kalkulator-Hippoteczny-${{ github.ref_name }}-portable.exe"
          $portablePath = Join-Path $executable.DirectoryName $portableName
          Copy-Item $executable.FullName $portablePath -Force
          gh release upload ${{ github.ref_name }} $portablePath --clobber
